// --- AUDIO SYNTHESIS ENGINE ---
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx;

const playSound = (type) => {
  if (!audioCtx) audioCtx = new AudioContext();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  
  const osc = audioCtx.createOscillator();
  const gainNode = audioCtx.createGain();
  osc.connect(gainNode);
  gainNode.connect(audioCtx.destination);

  const now = audioCtx.currentTime;
  
  switch(type) {
    case 'click':
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, now);
      osc.frequency.exponentialRampToValueAtTime(400, now + 0.1);
      gainNode.gain.setValueAtTime(0.1, now);
      gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
      osc.start(now);
      osc.stop(now + 0.1);
      break;
    case 'correct':
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(440, now);
      osc.frequency.setValueAtTime(660, now + 0.1);
      osc.frequency.setValueAtTime(880, now + 0.2);
      gainNode.gain.setValueAtTime(0.15, now);
      gainNode.gain.linearRampToValueAtTime(0, now + 0.4);
      osc.start(now);
      osc.stop(now + 0.4);
      break;
    case 'wrong':
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(300, now);
      osc.frequency.exponentialRampToValueAtTime(150, now + 0.3);
      gainNode.gain.setValueAtTime(0.15, now);
      gainNode.gain.linearRampToValueAtTime(0, now + 0.3);
      osc.start(now);
      osc.stop(now + 0.3);
      break;
    case 'victory':
      osc.type = 'sine';
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
        setTimeout(() => {
          if (!audioCtx) return;
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.connect(g);
          g.connect(audioCtx.destination);
          o.type = 'triangle';
          o.frequency.value = freq;
          g.gain.setValueAtTime(0.2, audioCtx.currentTime);
          g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5);
          o.start();
          o.stop(audioCtx.currentTime + 0.5);
        }, i * 150);
      });
      break;
    default:
      break;
  }
};

const SHUFFLE = (array) => {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
};


// Komponen Grafik Fungsi Menggunakan SVG
const MathGraph = ({ type }) => {
  const grid = (
    <g className="text-sky-200 stroke-current opacity-50" strokeWidth="1">
      {[...Array(11)].map((_, i) => (
        <React.Fragment key={i}>
          <line x1={i * 10} y1="0" x2={i * 10} y2="100" />
          <line x1="0" y1={i * 10} x2="100" y2={i * 10} />
        </React.Fragment>
      ))}
      <line x1="50" y1="0" x2="50" y2="100" strokeWidth="2" className="text-slate-400 opacity-80" />
      <line x1="0" y1="50" x2="100" y2="50" strokeWidth="2" className="text-slate-400 opacity-80" />
    </g>
  );

  let path;
  switch (type) {
    case 'linear': 
      path = <line x1="10" y1="90" x2="90" y2="10" stroke="#f472b6" strokeWidth="3" strokeLinecap="round" />;
      break;
    case 'quadratic': 
      path = <path d="M 20 10 Q 50 130 80 10" fill="none" stroke="#60a5fa" strokeWidth="3" strokeLinecap="round" />;
      break;
    case 'absolute': 
      path = <path d="M 10 10 L 50 50 L 90 10" fill="none" stroke="#34d399" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />;
      break;
    case 'rational': 
      path = (
        <g stroke="#fbbf24" strokeWidth="3" fill="none" strokeLinecap="round">
          <path d="M 10 90 Q 45 90 45 55" />
          <path d="M 55 45 Q 55 10 90 10" />
        </g>
      );
      break;
    case 'irrational': 
      path = <path d="M 10 90 Q 20 50 90 30" fill="none" stroke="#8b5cf6" strokeWidth="3" strokeLinecap="round" />;
      break;
    case 'exponential': 
      path = <path d="M 10 95 Q 70 95 90 10" fill="none" stroke="#a78bfa" strokeWidth="3" strokeLinecap="round" />;
      break;
    case 'step': 
      path = (
        <g stroke="#f87171" strokeWidth="3" strokeLinecap="round">
          <line x1="10" y1="80" x2="30" y2="80" />
          <circle cx="10" cy="80" r="3" fill="#f87171" />
          <circle cx="30" cy="80" r="3" fill="none" stroke="#f87171" strokeWidth="2" />
          <line x1="30" y1="60" x2="50" y2="60" />
          <circle cx="30" cy="60" r="3" fill="#f87171" />
          <circle cx="50" cy="60" r="3" fill="none" stroke="#f87171" strokeWidth="2" />
          <line x1="50" y1="40" x2="70" y2="40" />
          <circle cx="50" cy="40" r="3" fill="#f87171" />
          <circle cx="70" cy="40" r="3" fill="none" stroke="#f87171" strokeWidth="2" />
          <line x1="70" y1="20" x2="90" y2="20" />
          <circle cx="70" cy="20" r="3" fill="#f87171" />
          <circle cx="90" cy="20" r="3" fill="none" stroke="#f87171" strokeWidth="2" />
        </g>
      );
      break;
    case 'piecewise': 
      path = (
        <g stroke="#2dd4bf" strokeWidth="3" strokeLinecap="round">
          <line x1="10" y1="90" x2="50" y2="50" />
          <circle cx="50" cy="50" r="3" fill="none" stroke="#2dd4bf" strokeWidth="2" />
          <circle cx="50" cy="20" r="4" fill="#2dd4bf" />
          <line x1="50" y1="20" x2="90" y2="20" />
        </g>
      );
      break;
    default:
      path = null;
  }

  return (
    <svg viewBox="0 0 100 100" className="w-full h-full bg-white rounded-xl border-2 border-slate-100 shadow-inner">
      {grid}
      {path}
    </svg>
  );
};

                    <div className="grid grid-cols-2 gap-2 my-2">
                      <div className="bg-white p-3 rounded-xl border border-slate-200"><b className="text-pink-500">Domain:</b> Seluruh bilangan Real (x ∈ R)</div>
                      <div className="bg-white p-3 rounded-xl border border-slate-200"><b className="text-pink-500">Range:</b> Seluruh bilangan Real (y ∈ R)</div>
                    </div>
                    <p><b>Langkah Menggambar:</b> Cari titik potong Sumbu Y (set x=0) dan potong Sumbu X (set f(x)=0), lalu tarik garis lurus melewati dua titik itu.</p>
                    <div className="bg-white p-4 rounded-xl border border-slate-200 mt-2">
                      <p className="font-bold text-slate-700 mb-1">Contoh: Gambarlah f(x) = 2x - 4</p>
                      <ul className="list-disc pl-4 space-y-1 text-slate-500">
                        <li>Jika x = 0 ➔ y = -4. Titik: (0, -4)</li>
                        <li>Jika y = 0 ➔ 0 = 2x - 4 ➔ x = 2. Titik: (2, 0)</li>
                        <li>Hubungkan (0, -4) dan (2, 0) membentuk garis diagonal naik.</li>
                      </ul>
                    </div>
                  </div>
                </div>

                {/* Kuadrat */}
                <div className="bg-slate-50 rounded-3xl p-6 md:p-8 border-2 border-slate-200 shadow-sm flex flex-col lg:flex-row gap-6">
                  <div className="w-full lg:w-1/3">
                    <div className="aspect-square bg-white rounded-2xl p-2 border-2 border-blue-100"><MathGraph type="quadratic" /></div>
                    <h4 className="font-black text-blue-500 mt-4 text-xl">Fungsi Kuadrat</h4>
                    <p className="text-sm text-slate-500 font-mono mt-1 bg-blue-50 inline-block px-3 py-1 rounded-full">f(x) = ax² + bx + c</p>
                  </div>
                  <div className="w-full lg:w-2/3 space-y-3 text-sm text-slate-600">
                    <p>Grafiknya berbentuk Parabola. Jika a &gt; 0 terbuka ke atas, jika a &lt; 0 terbuka ke bawah.</p>
                    <div className="grid grid-cols-2 gap-2 my-2">
                      <div className="bg-white p-3 rounded-xl border border-slate-200"><b className="text-blue-500">Domain:</b> x ∈ R</div>
                      <div className="bg-white p-3 rounded-xl border border-slate-200"><b className="text-blue-500">Range:</b> Dibatasi oleh Titik Puncak</div>
                    </div>
                    <p><b>Langkah Menggambar:</b> Cari akar (jika ada) dengan pemfaktoran, lalu cari Sumbu Simetri <span className="font-mono">x = -b/2a</span> dan Titik Puncak (masukkan sumbu simetri ke fungsi).</p>
                    <div className="bg-white p-4 rounded-xl border border-slate-200 mt-2">
                      <p className="font-bold text-slate-700 mb-1">Contoh: f(x) = x² - 4x</p>
                      <ul className="list-disc pl-4 space-y-1 text-slate-500">
                        <li>Akar (y=0): x(x - 4) = 0 ➔ x=0 dan x=4. Titik: (0,0) & (4,0)</li>
                        <li>Sumbu Simetri: x = -(-4)/(2*1) = 2.</li>
                        <li>Puncak (x=2): y = 2² - 4(2) = 4 - 8 = -4. Puncak di (2, -4)</li>
                        <li>Range: y ≥ -4. Gambar parabola dari titik-titik tersebut.</li>
                      </ul>
                    </div>
                  </div>
                </div>

                {/* Nilai Mutlak */}
                <div className="bg-slate-50 rounded-3xl p-6 md:p-8 border-2 border-slate-200 shadow-sm flex flex-col lg:flex-row gap-6">
                  <div className="w-full lg:w-1/3">
                    <div className="aspect-square bg-white rounded-2xl p-2 border-2 border-emerald-100"><MathGraph type="absolute" /></div>
                    <h4 className="font-black text-emerald-500 mt-4 text-xl">Fungsi Nilai Mutlak</h4>
                    <p className="text-sm text-slate-500 font-mono mt-1 bg-emerald-50 inline-block px-3 py-1 rounded-full">f(x) = |x|</p>
                  </div>
                  <div className="w-full lg:w-2/3 space-y-3 text-sm text-slate-600">
                    <p>Fungsi yang selalu menghasilkan nilai positif atau nol. Grafiknya selalu memantul ke atas (berbentuk huruf V).</p>
                    <div className="grid grid-cols-2 gap-2 my-2">
                      <div className="bg-white p-3 rounded-xl border border-slate-200"><b className="text-emerald-500">Domain:</b> x ∈ R</div>
                      <div className="bg-white p-3 rounded-xl border border-slate-200"><b className="text-emerald-500">Range:</b> y ≥ 0</div>
                    </div>
                    <p><b>Langkah Menggambar:</b> Cari pembuat nol di dalam tanda mutlak (ini akan menjadi titik sudut/puncak V). Ambil titik di kiri dan kanannya.</p>
                    <div className="bg-white p-4 rounded-xl border border-slate-200 mt-2">
                      <p className="font-bold text-slate-700 mb-1">Contoh: f(x) = |x - 3|</p>
                      <ul className="list-disc pl-4 space-y-1 text-slate-500">
                        <li>Pembuat nol: x - 3 = 0 ➔ x = 3. Titik sudut (3, 0)</li>
                        <li>Ambil x = 1 ➔ y = |-2| = 2. Titik (1, 2)</li>
                        <li>Ambil x = 5 ➔ y = |2| = 2. Titik (5, 2)</li>
                        <li>Hubungkan ketiga titik tersebut menjadi huruf V.</li>
                      </ul>
                    </div>
                  </div>
                </div>

                {/* Rasional */}
                <div className="bg-slate-50 rounded-3xl p-6 md:p-8 border-2 border-slate-200 shadow-sm flex flex-col lg:flex-row gap-6">
                  <div className="w-full lg:w-1/3">
                    <div className="aspect-square bg-white rounded-2xl p-2 border-2 border-amber-100"><MathGraph type="rational" /></div>
                    <h4 className="font-black text-amber-500 mt-4 text-xl">Fungsi Rasional</h4>
                    <p className="text-sm text-slate-500 font-mono mt-1 bg-amber-50 inline-block px-3 py-1 rounded-full">f(x) = P(x) / Q(x)</p>
                  </div>
                  <div className="w-full lg:w-2/3 space-y-3 text-sm text-slate-600">
                    <p>Fungsi berbentuk pecahan dimana penyebutnya mengandung variabel. Memiliki <b>Asimtot</b> (garis putus-putus batas yang didekati kurva tapi tidak pernah disentuh).</p>
                    <div className="grid grid-cols-2 gap-2 my-2">
                      <div className="bg-white p-3 rounded-xl border border-slate-200"><b className="text-amber-500">Domain:</b> Q(x) ≠ 0</div>
                      <div className="bg-white p-3 rounded-xl border border-slate-200"><b className="text-amber-500">Range:</b> Tergantung Asimtot datar y</div>
                    </div>
                    <p><b>Langkah Menggambar:</b> Tentukan asimtot tegak (saat penyebut = 0) dan asimtot datar. Lalu, cari titik potong sumbu x dan sumbu y.</p>
                    <div className="bg-white p-4 rounded-xl border border-slate-200 mt-2">
                      <p className="font-bold text-slate-700 mb-1">Contoh: f(x) = 1 / (x - 2)</p>
                      <ul className="list-disc pl-4 space-y-1 text-slate-500">
                        <li>Asimtot tegak: penyebut x - 2 = 0 ➔ x = 2 (garis vertikal di x=2)</li>
                        <li>Ambil titik kanan: Jika x = 3 ➔ y = 1. Jika x = 4 ➔ y = 0.5</li>
                        <li>Ambil titik kiri: Jika x = 1 ➔ y = -1. Jika x = 0 ➔ y = -0.5</li>
                        <li>Grafiknya terpecah menjadi dua kurva hiperbola di kiri-bawah dan kanan-atas asimtot.</li>
                      </ul>
                    </div>
                  </div>
                </div>

                {/* Irrasional (Akar) */}
                <div className="bg-slate-50 rounded-3xl p-6 md:p-8 border-2 border-slate-200 shadow-sm flex flex-col lg:flex-row gap-6">
                  <div className="w-full lg:w-1/3">
                    <div className="aspect-square bg-white rounded-2xl p-2 border-2 border-violet-100"><MathGraph type="irrational" /></div>
                    <h4 className="font-black text-violet-500 mt-4 text-xl">Fungsi Irrasional (Akar)</h4>
                    <p className="text-sm text-slate-500 font-mono mt-1 bg-violet-50 inline-block px-3 py-1 rounded-full">f(x) = √x</p>
                  </div>
                  <div className="w-full lg:w-2/3 space-y-3 text-sm text-slate-600">
                    <p>Fungsi dimana variabel bebasnya berada di bawah tanda akar. Grafiknya berbentuk setengah parabola yang terbaring horizontal.</p>
                    <div className="grid grid-cols-2 gap-2 my-2">
                      <div className="bg-white p-3 rounded-xl border border-slate-200"><b className="text-violet-500">Domain:</b> Nilai dalam akar ≥ 0</div>
                      <div className="bg-white p-3 rounded-xl border border-slate-200"><b className="text-violet-500">Range:</b> y ≥ 0 (akar utama)</div>
                    </div>
                    <p><b>Langkah Menggambar:</b> Tentukan titik pangkal/awal dengan membuat nilai di dalam akar = 0. Lalu ambil nilai x lain yang hasil akarnya merupakan bilangan bulat positif sempurna.</p>
                    <div className="bg-white p-4 rounded-xl border border-slate-200 mt-2">
                      <p className="font-bold text-slate-700 mb-1">Contoh: f(x) = √(x - 1)</p>
                      <ul className="list-disc pl-4 space-y-1 text-slate-500">
                        <li>Titik awal: x - 1 = 0 ➔ x = 1. Saat x=1, y=0. Titik: (1, 0)</li>
                        <li>Biar mudah diakar, ambil x yang membuat (x-1) bernilai 1 atau 4:
                          <ul className="list-circle pl-5 mt-1">
                            <li>x = 2 ➔ (2-1) = 1 ➔ y = √1 = 1. Titik (2, 1)</li>
                            <li>x = 5 ➔ (5-1) = 4 ➔ y = √4 = 2. Titik (5, 2)</li>
                          </ul>
                        </li>
                        <li>Tarik kurva melengkung lembut ke arah kanan atas bermula dari (1,0).</li>
                      </ul>
                    </div>
                  </div>
                </div>

                {/* Eksponensial */}
                <div className="bg-slate-50 rounded-3xl p-6 md:p-8 border-2 border-slate-200 shadow-sm flex flex-col lg:flex-row gap-6">
                  <div className="w-full lg:w-1/3">
                    <div className="aspect-square bg-white rounded-2xl p-2 border-2 border-purple-100"><MathGraph type="exponential" /></div>
                    <h4 className="font-black text-purple-500 mt-4 text-xl">Fungsi Eksponensial</h4>
                    <p className="text-sm text-slate-500 font-mono mt-1 bg-purple-50 inline-block px-3 py-1 rounded-full">f(x) = aˣ (a&gt;0, a≠1)</p>
                  </div>
                  <div className="w-full lg:w-2/3 space-y-3 text-sm text-slate-600">
                    <p>Pertumbuhannya sangat cepat! Grafiknya melengkung tajam dan tidak pernah menyentuh sumbu X (Asimtot datar y=0).</p>
                    <div className="grid grid-cols-2 gap-2 my-2">
                      <div className="bg-white p-3 rounded-xl border border-slate-200"><b className="text-purple-500">Domain:</b> x ∈ R</div>
                      <div className="bg-white p-3 rounded-xl border border-slate-200"><b className="text-purple-500">Range:</b> y &gt; 0</div>
                    </div>
                    <p><b>Langkah Menggambar:</b> Karena grafiknya melengkung drastis, buatlah tabel bantuan dengan memasukkan angka kecil (misal x = -1, 0, 1, 2) untuk membentuk kurva mulus.</p>
                    <div className="bg-white p-4 rounded-xl border border-slate-200 mt-2">
                      <p className="font-bold text-slate-700 mb-1">Contoh: f(x) = 2ˣ</p>
                      <ul className="list-disc pl-4 space-y-1 text-slate-500">
                        <li>x = 0 ➔ y = 2⁰ = 1 (titik potong sumbu Y)</li>
                        <li>x = 1 ➔ y = 2¹ = 2</li>
                        <li>x = 2 ➔ y = 2² = 4</li>
                        <li>x = -1 ➔ y = 2⁻¹ = 1/2. Hubungkan titik dengan kurva yang melesat ke atas.</li>
                      </ul>
                    </div>
                  </div>
                </div>

                {/* Piecewise */}
                <div className="bg-slate-50 rounded-3xl p-6 md:p-8 border-2 border-slate-200 shadow-sm flex flex-col lg:flex-row gap-6">
                  <div className="w-full lg:w-1/3">
                    <div className="aspect-square bg-white rounded-2xl p-2 border-2 border-teal-100"><MathGraph type="piecewise" /></div>
                    <h4 className="font-black text-teal-500 mt-4 text-xl">Fungsi Piecewise</h4>
                    <p className="text-sm text-slate-500 font-mono mt-1 bg-teal-50 inline-block px-3 py-1 rounded-full">f(x) terbagi syarat</p>
                  </div>
                  <div className="w-full lg:w-2/3 space-y-3 text-sm text-slate-600">
                    <p>Disebut juga Fungsi Sepotong-sepotong. Ini adalah fungsi yang aturannya berbeda di interval nilai x yang berbeda.</p>
                    <p><b>Langkah Menggambar:</b> Perlakukan sebagai beberapa fungsi terpisah. Gambar fungsi pertama, tapi HANYA pada interval yang disyaratkan (hapus sisanya). Ulangi untuk fungsi kedua.</p>
                    <div className="bg-white p-4 rounded-xl border border-slate-200 mt-2">
                      <p className="font-bold text-slate-700 mb-1">Contoh Soal:</p>
                      <p className="font-mono text-xs bg-slate-100 p-2 rounded mb-2">f(x) = {"{ x, jika x < 2 ; 4, jika x ≥ 2 }"}</p>
                      <ul className="list-disc pl-4 space-y-1 text-slate-500">
                        <li><b>Bagian Kiri (x &lt; 2):</b> Fungsi adalah f(x) = x (garis lurus diagonal). Gambar garis ini TAPI berhenti di titik (2,2) dengan <b>bulatan kosong</b> (karena tidak ada tanda sama dengan).</li>
                        <li><b>Bagian Kanan (x ≥ 2):</b> Fungsi konstan f(x) = 4. Mulai dari titik (2,4) dengan <b>bulatan penuh</b>, tarik garis horizontal mendatar ke arah kanan.</li>
                      </ul>
                    </div>
                  </div>
                </div>

                {/* Tangga (Step Function) */}
                <div className="bg-slate-50 rounded-3xl p-6 md:p-8 border-2 border-slate-200 shadow-sm flex flex-col lg:flex-row gap-6">
                  <div className="w-full lg:w-1/3">
                    <div className="aspect-square bg-white rounded-2xl p-2 border-2 border-rose-100"><MathGraph type="step" /></div>
                    <h4 className="font-black text-rose-500 mt-4 text-xl">Fungsi Tangga (Floor)</h4>
                    <p className="text-sm text-slate-500 font-mono mt-1 bg-rose-50 inline-block px-3 py-1 rounded-full">f(x) = ⌊x⌋</p>
                  </div>
                  <div className="w-full lg:w-2/3 space-y-3 text-sm text-slate-600">
                    <p>Fungsi yang membulatkan angka desimal ke bilangan bulat terdekat ke bawah. Grafiknya terputus-putus seperti anak tangga.</p>
                    <div className="grid grid-cols-2 gap-2 my-2">
                      <div className="bg-white p-3 rounded-xl border border-slate-200"><b className="text-rose-500">Domain:</b> x ∈ R</div>
                      <div className="bg-white p-3 rounded-xl border border-slate-200"><b className="text-rose-500">Range:</b> Bilangan Bulat (Z)</div>
                    </div>
                    <div className="bg-white p-4 rounded-xl border border-slate-200 mt-2">
                      <p className="font-bold text-slate-700 mb-1">Konsep & Cara Menggambar:</p>
                      <ul className="list-disc pl-4 space-y-1 text-slate-500">
                        <li>Arti ⌊1.5⌋ adalah 1. Begitu pula ⌊1.99⌋ adalah 1. Tetapi ⌊2.0⌋ adalah 2.</li>
                        <li>Untuk interval 0 ≤ x &lt; 1, nilai y = 0. Grafiknya berupa garis horizontal dari x=0 (bulatan penuh) sampai x=1 (bulatan kosong).</li>
                        <li>Untuk interval 1 ≤ x &lt; 2, nilai y = 1. Garis horizontal melompat naik setingkat. Pola anak tangga ini diteruskan.</li>
                      </ul>
                    </div>
                  </div>
                </div>

              </div>
            </div>

            <button onClick={() => completeStage(0)} className="w-full bg-teal-400 text-white font-black text-xl py-6 rounded-full shadow-[0_6px_0_rgb(20,184,166)] hover:bg-teal-300 active:shadow-none active:translate-y-[6px] transition-all uppercase tracking-widest mt-12 flex items-center justify-center gap-3">
              <CheckCircle2 className="w-8 h-8" /> Saya Siap Mengerjakan Misi!
            </button>
          </div>
        </div>
      </div>
    );
  }

  if (screen === 'mission' || screen === 'boss') {
    const q = activeQuestions[qIndex];
    const isBoss = screen === 'boss';
    
    return (
      <div className={`min-h-screen flex flex-col font-sans ${isBoss ? 'bg-amber-50' : 'bg-[#fdfbf7]'}`}>
        <Header />
        
        <div className="w-full bg-slate-100 h-3 flex">
          {activeQuestions.map((_, i) => (
            <div key={i} className={`flex-1 mx-0.5 rounded-full ${i < qIndex ? (isBoss ? 'bg-amber-400' : 'bg-sky-400') : (i === qIndex ? 'bg-pink-300 animate-pulse' : 'bg-slate-200')}`}></div>
          ))}
        </div>

        <div className="flex-1 flex flex-col items-center justify-center p-4 md:p-8">
          <div className="w-full max-w-2xl relative">
            
            <div className="bg-white border-2 border-slate-100 p-6 md:p-10 rounded-[2rem] shadow-xl mb-8 relative z-10">
               <div className="absolute -top-12 -left-6 z-20">
                 <CharacterCat mood="idle" className="w-20 h-20 drop-shadow-md" />
               </div>
               
               <div className="text-slate-400 font-bold tracking-widest uppercase text-xs mb-4 text-right">
                {isBoss ? <span className="text-amber-500 font-black">🔥 Boss Battle 🔥</span> : `Pertanyaan ${qIndex + 1}`}
               </div>
               
              <h3 className="text-xl md:text-2xl font-black text-slate-700 leading-relaxed text-center">{q.q}</h3>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              {q.isBoolean ? (
                <>
                  <button onClick={() => handleAnswer(true)} disabled={!!feedback} className="bg-white border-2 border-sky-100 hover:border-sky-400 hover:bg-sky-50 text-slate-700 font-black py-6 rounded-2xl text-xl shadow-[0_4px_0_rgb(224,242,254)] active:shadow-none active:translate-y-[4px] transition-all disabled:opacity-50">
                    FUNGSI
                  </button>
                  <button onClick={() => handleAnswer(false)} disabled={!!feedback} className="bg-white border-2 border-pink-100 hover:border-pink-400 hover:bg-pink-50 text-slate-700 font-black py-6 rounded-2xl text-xl shadow-[0_4px_0_rgb(252,231,243)] active:shadow-none active:translate-y-[4px] transition-all disabled:opacity-50">
                    BUKAN FUNGSI
                  </button>
                </>
              ) : (
                q.options.map((opt, idx) => {
                  const colors = [
                    { border: 'border-sky-200', bgHover: 'hover:bg-sky-50', text: 'text-sky-500', shadow: 'shadow-[0_4px_0_rgb(186,230,253)]' },
                    { border: 'border-pink-200', bgHover: 'hover:bg-pink-50', text: 'text-pink-500', shadow: 'shadow-[0_4px_0_rgb(251,207,232)]' },
                    { border: 'border-amber-200', bgHover: 'hover:bg-amber-50', text: 'text-amber-500', shadow: 'shadow-[0_4px_0_rgb(253,230,138)]' },
                    { border: 'border-teal-200', bgHover: 'hover:bg-teal-50', text: 'text-teal-500', shadow: 'shadow-[0_4px_0_rgb(153,246,228)]' }
                  ];
                  const c = colors[idx % 4];
                  return (
                    <button key={idx} onClick={() => handleAnswer(idx)} disabled={!!feedback} className={`bg-white border-2 ${c.border} ${c.bgHover} text-left px-6 py-5 rounded-2xl text-slate-600 font-bold transition-all disabled:opacity-50 flex items-center gap-4 group ${c.shadow} active:shadow-none active:translate-y-[4px]`}>
                      <div className={`w-10 h-10 rounded-full bg-slate-50 flex items-center justify-center text-lg font-black border-2 ${c.border} ${c.text}`}>
                        {['A','B','C','D'][idx]}
                      </div>
                      <span className="flex-1 leading-tight">{opt}</span>
                    </button>
                  );
                })
              )}
            </div>
          </div>
        </div>
        <FeedbackOverlay />
      </div>
    );
  }

  if (screen === 'classifier') {
    const functions = classifierFunctions;
    const categories = ["LINEAR", "KUADRAT", "RASIONAL", "NILAI MUTLAK", "EKSPONENSIAL", "LOGARITMA", "IRRASIONAL", "TANGGA"];

    const handleMatch = (cat) => {
      if (selectedFunc !== null) {
        playSfx('click');
        setMatches(prev => ({ ...prev, [selectedFunc]: cat }));
        setSelectedFunc(null);
      }
    };

    const submitClassification = () => {
      let correctCount = 0;
      functions.forEach((f, idx) => {
        if (matches[idx] === f.type) correctCount++;
      });
      
      const score = Math.round((correctCount / functions.length) * 100);
      setClassifierScore(score);
      const earnedXP = correctCount * 50;
      
      setStats(prev => ({
        ...prev,
        xp: prev.xp + earnedXP,
        correct: prev.correct + correctCount,
        totalAnswered: prev.totalAnswered + functions.length
      }));
      
      if(score >= 80) playSfx('victory'); else playSfx('correct');
      setIsSubmitted(true);
    };

    return (
      <div className="min-h-screen bg-[#fdfbf7] flex flex-col font-sans">
        <Header />
        <div className="flex-1 p-4 md:p-8 flex flex-col max-w-5xl mx-auto w-full">
          <div className="text-center mb-8 flex flex-col items-center">
             <CharacterCat mood="idle" className="w-16 h-16 mb-2" />
            <h2 className="text-2xl font-black text-pink-500 uppercase tracking-widest mb-2">Stage 4: Sortir Fungsi</h2>
            <p className="text-slate-500 font-medium bg-white px-4 py-2 rounded-full shadow-sm">Pilih persamaan di kiri, lalu pasangkan dengan namanya di kanan!</p>
          </div>

          {!isSubmitted ? (
            <>
              <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 flex-1">
                {/* Kiri: Fungsi */}
                <div className="bg-white p-6 rounded-3xl border-2 border-slate-100 shadow-sm flex flex-col gap-3">
                  <h3 className="text-slate-400 font-bold text-sm uppercase tracking-wider mb-2 text-center">Persamaan</h3>
                  {functions.map((f, i) => (
                    <button 
                      key={i} 
                      onClick={() => setSelectedFunc(i)}
                      className={`text-left p-4 rounded-2xl border-2 transition-all font-mono font-bold text-lg flex justify-between items-center
                        ${matches[i] 
                          ? 'opacity-50 border-emerald-200 bg-emerald-50 text-slate-500' 
                          : (selectedFunc === i 
                              ? 'border-sky-400 bg-sky-50 shadow-md text-sky-600 scale-[1.02]' 
                              : 'border-slate-200 bg-white hover:border-sky-200 text-slate-700')}`}
                    >
                      <span>{f.expr}</span>
                      {matches[i] && <span className="text-xs font-sans text-emerald-600 bg-emerald-100 px-2 py-1 rounded-full">{matches[i]}</span>}
                    </button>
                  ))}
                </div>
                
                {/* Kanan: Kategori */}
                <div className="bg-white p-6 rounded-3xl border-2 border-slate-100 shadow-sm">
                  <h3 className="text-slate-400 font-bold text-sm uppercase tracking-wider mb-4 text-center">Jenis Fungsi</h3>
                  <div className="grid grid-cols-2 gap-3">
                    {categories.map(cat => (
                      <button 
                        key={cat} 
                        onClick={() => handleMatch(cat)}
                        disabled={selectedFunc === null}
                        className={`p-4 rounded-2xl border-2 font-black text-xs md:text-sm uppercase tracking-wider transition-all shadow-[0_4px_0_rgba(0,0,0,0.05)] active:shadow-none active:translate-y-[4px]
                          ${selectedFunc !== null 
                            ? 'border-pink-300 text-pink-500 bg-pink-50 hover:bg-pink-100 cursor-pointer' 
                            : 'border-slate-100 text-slate-400 bg-slate-50 opacity-50 cursor-not-allowed'}`}
                      >
                        {cat}
                      </button>
                    ))}
                  </div>
                </div>
              </div>
              
              <div className="mt-8 flex justify-center">
                <button 
                  onClick={submitClassification}
                  disabled={Object.keys(matches).length < functions.length}
                  className="bg-teal-400 hover:bg-teal-300 disabled:bg-slate-200 disabled:text-slate-400 disabled:shadow-none text-white px-12 py-4 rounded-full font-black text-xl uppercase tracking-widest transition-all shadow-[0_6px_0_rgb(20,184,166)] active:shadow-none active:translate-y-[6px]"
                >
                  Cek Hasilnya
                </button>
              </div>
            </>
          ) : (
            <div className="flex-1 flex items-center justify-center">
              <div className="bg-white border-2 border-slate-100 p-8 rounded-3xl text-center max-w-md w-full shadow-xl">
                <CharacterCat mood={classifierScore >= 80 ? 'happy' : 'idle'} className="w-24 h-24 mx-auto mb-4" />
                <div className="inline-flex items-center justify-center w-24 h-24 rounded-full bg-sky-50 border-4 border-sky-400 mb-6 relative">
                  <span className="text-3xl font-black text-sky-500">{classifierScore}%</span>
                </div>
                <h2 className="text-2xl font-black text-slate-700 mb-2 uppercase">Analisis Selesai</h2>
                <p className="text-slate-500 mb-8 font-medium">Kamu berhasil memasangkan {Object.values(matches).filter((m,i)=>m===functions[i].type).length} dari {functions.length} fungsi dengan benar.</p>
                <button onClick={() => completeStage(4)} className="w-full bg-sky-400 text-white font-bold py-4 rounded-2xl uppercase tracking-wider transition-all shadow-[0_6px_0_rgb(56,189,248)] active:shadow-none active:translate-y-[6px]">
                  Kembali ke Peta
                </button>
              </div>
            </div>
          )}
        </div>
      </div>
    );
  }

  if (screen === 'result') {
    const accuracy = Math.round((stats.correct/stats.totalAnswered)*100 || 0);
    let titleMsg = "Berhasil!";
    let mood = "happy";
    
    if (accuracy < 60) {
      titleMsg = "Tetap Semangat!";
      mood = "idle";
    }

    return (
      <div className="min-h-screen bg-sky-50 flex flex-col items-center justify-center p-6 font-sans relative overflow-hidden">
        <div className="absolute inset-0 overflow-hidden pointer-events-none">
           {[...Array(30)].map((_, i) => {
             const colors = ['#38bdf8', '#f472b6', '#fbbf24', '#34d399'];
             return (
               <div key={i} className="absolute w-3 h-3 rounded-sm animate-[fall_4s_linear_infinite]" style={{
                 left: `${Math.random()*100}%`, 
                 top: `-20px`, 
                 animationDelay: `${Math.random()*4}s`, 
                 backgroundColor: colors[Math.floor(Math.random()*colors.length)]
               }}></div>
             );
           })}
        </div>
        <style>{`@keyframes fall { to { transform: translateY(100vh) rotate(360deg); } }`}</style>

        <div className="bg-white border-2 border-slate-100 p-8 md:p-12 rounded-[2.5rem] shadow-2xl text-center max-w-xl w-full relative z-10 flex flex-col items-center">
          <CharacterCat mood={mood} className="w-32 h-32 mb-4" />
          <h2 className="text-4xl md:text-5xl font-black text-slate-700 mb-2">{titleMsg}</h2>
          <p className="text-slate-500 font-bold text-lg mb-8 bg-slate-100 px-6 py-2 rounded-full">{user.name} | {user.class}</p>
          
          <div className="w-full grid grid-cols-2 gap-4 mb-8">
            <div className="bg-sky-50 p-6 rounded-3xl border-2 border-sky-100 flex flex-col items-center">
              <div className="text-xs text-sky-500 uppercase font-bold mb-1 tracking-widest">Total XP</div>
              <div className="text-4xl font-black text-sky-500">{stats.xp}</div>
            </div>
            <div className="bg-pink-50 p-6 rounded-3xl border-2 border-pink-100 flex flex-col items-center">
              <div className="text-xs text-pink-500 uppercase font-bold mb-1 tracking-widest">Akurasi</div>
              <div className="text-4xl font-black text-pink-500">{accuracy}%</div>
            </div>
            <div className="bg-amber-50 p-6 rounded-3xl border-2 border-amber-100 flex flex-col items-center col-span-2">
              <div className="text-xs text-amber-500 uppercase font-bold mb-1 tracking-widest">Jawaban Benar</div>
              <div className="text-3xl font-black text-amber-500">{stats.correct} dari {stats.totalAnswered}</div>
            </div>
          </div>

          <button onClick={() => window.location.reload()} className="text-slate-400 hover:text-slate-600 font-bold uppercase tracking-wider transition-colors border-b-2 border-transparent hover:border-slate-300 pb-1">
            Main Lagi
          </button>
        </div>
      </div>
    );
  }

  return null;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
